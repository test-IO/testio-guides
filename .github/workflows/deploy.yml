name: Deploy to GitHub Pages

env:
  NEXT_PUBLIC_DOCSEARCH_APP_ID: ${{ vars.NEXT_PUBLIC_DOCSEARCH_APP_ID }}
  NEXT_PUBLIC_DOCSEARCH_API_KEY: ${{ vars.NEXT_PUBLIC_DOCSEARCH_API_KEY }}
  NEXT_PUBLIC_DOCSEARCH_INDEX_NAME: ${{ vars.NEXT_PUBLIC_DOCSEARCH_INDEX_NAME }}
  NEXT_PUBLIC_GOOGLE_ANALYTICS: ${{ vars.NEXT_PUBLIC_GOOGLE_ANALYTICS }}

on:
  push:
    branches:
      - main
      - test-deploy # temporary branch for testing
  workflow_dispatch: # allows manual triggering
    inputs:
      branch:
        description: "Branch to deploy"
        required: true
        default: "main"
        type: string
      environment:
        description: "Environment to deploy to"
        required: true
        default: "github-pages"
        type: choice
        options:
          - github-pages

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Detect package manager
        id: detect-package-manager
        run: |
          if [ -f "${{ github.workspace }}/yarn.lock" ]; then
            echo "manager=yarn" >> $GITHUB_OUTPUT
            echo "command=install" >> $GITHUB_OUTPUT
            echo "runner=yarn" >> $GITHUB_OUTPUT
            exit 0
          elif [ -f "${{ github.workspace }}/package.json" ]; then
            echo "manager=npm" >> $GITHUB_OUTPUT
            echo "command=ci" >> $GITHUB_OUTPUT
            echo "runner=npx --no-install" >> $GITHUB_OUTPUT
            exit 0
          else
            echo "Unable to determine packager manager"
            exit 1
          fi
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: ${{ steps.detect-package-manager.outputs.manager }}
      - name: Setup Pages
        uses: actions/configure-pages@v6
        with:
          static_site_generator: next
      - name: Restore cache
        uses: actions/cache@v6
        with:
          path: |
            .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json', '**/yarn.lock') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json', '**/yarn.lock') }}-
      - name: Install dependencies
        run: ${{ steps.detect-package-manager.outputs.manager }} ${{ steps.detect-package-manager.outputs.command }}
      - name: Build with Next.js
        run: ${{ steps.detect-package-manager.outputs.runner }} next build --webpack
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./out

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # Re-index the deployed site in Algolia with the scraper (private repo, master branch)
  algolia_reindex:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Checkout scraper
        uses: actions/checkout@v7
        with:
          repository: test-IO/cirro-guides-scraper
          ref: master
          ssh-key: ${{ secrets.SCRAPER_REPO_CLONE_KEY }}
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version-file: Pipfile
      - name: Install dependencies
        run: pip install pipenv && PIPENV_VENV_IN_PROJECT=1 pipenv sync
      - name: Index testio_guides
        env:
          APPLICATION_ID: ${{ vars.NEXT_PUBLIC_DOCSEARCH_APP_ID }}
          API_KEY: ${{ secrets.ALGOLIA_WRITE_API_KEY }}
        # empty .env: without it the CLI prompts for credentials and hangs
        run: touch .env && ./docsearch run configs/testio_guides.json
